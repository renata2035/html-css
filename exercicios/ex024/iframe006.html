<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dicas para iframe</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Conteudos dentro de iframe<h1>
        <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Voluptate nihil libero error molestias quaerat vitae? Sunt earum animi rem officiis nesciunt quae illum, cumque modi quidem, minus aspernatur eum dicta.</p>
        <h2>Videos</h2>
        <iframe width="560" height="315" src="https://www.youtube.com/embed/P48ZB1I6QPc?si=AJvgZne--OrmsAJT" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        <h2>Mapa do Google</h2>
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3658.546848989931!2d-46.36622442571586!3d-23.51282615980887!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94ce64cac27912a9%3A0x46736d7590b6dba9!2sRua%20Alcantara%2C%20515%20-%20Cidade%20Kemel%2C%20Po%C3%A1%20-%20SP%2C%2008554-200!5e0!3m2!1spt-BR!2sbr!4v1750635321779!5m2!1spt-BR!2sbr" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>

        <h2>Mapas do waze</h2>
        <iframe src="https://embed.waze.com/iframe?zoom=16&lat=-23.512906&lon=-46.363574&ct=livemap" width="600" height="450" allowfullscreen></iframe>
</body>
</html>
