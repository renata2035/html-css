<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
           background-color: salmon;
           display: flex;
           flex-flow: row nowrap;

        }

        div.item{
            background-color: aqua;
            border: 1px solid black;
            text-align: center;
           
            
        }

        div#CxA {
            
            /*flex-shrink: 1;
            flex-grow: 0;
            flex-basis: 200px;*/

             flex: 0 1 200px
        }
        
        div#CxB {

            flex-shrink: 1;
            flex-grow: 1;
             flex-basis: 150px;
        }

        div#CxC {
              flex-shrink: 8;
              flex-grow: 1;
               flex-basis: auto;

        }
    </style>
</head>
<body>
    <div class="conteiner">
       <div class="item" id="CxA">A</div>
       <div class="item" id="CxB">B</div>
       <div class="item" id="CxC">C</div>
       
       
        
    </div>
    
</body>
</html>
